{% extends 'base.html' %}
<!-- 在每个 glass-card 中添加 -->
<div class="corner-tl"></div>
<div class="corner-tr"></div>
<div class="corner-bl"></div>
<div class="corner-br"></div>
{% block content %}
<header class="top-bar motor-page-hero">
    <div>
        <div class="motor-hero-label"><i></i> MOTOR CONTROL · 1025</div>
        <h2>单电机测试</h2>
        <p>对各个部件的单独控制：头、左右胳膊、左右腿</p>
        <a href="#motor-control-panel" class="motor-hero-link">进入控制面板 <span>↘</span></a>
    </div>
</header>

<section class="content-grid" id="motor-control-panel">
    <article class="glass-card card-wide">
        <div class="card-header">
            <div>
                <h3>部件控制面板</h3>
                <p>选择模块后进行启停与参数调整</p>
            </div>
            <div>
                <button class="btn-secondary">保存配置</button>
                <button class="btn-primary" id="batchTestBtn">一键测试</button>
            </div>
        </div>
        <div class="status-list test-list">
            <div class="status-item">
                <div>
                    <strong>左机械腿</strong>
                </div>
                <button class="btn-outline test-btn" data-target="left_leg" data-loading="true">测试</button>
            </div>
            <div class="status-item">
                <div>
                    <strong>右机械腿</strong>
                </div>
                <button class="btn-outline test-btn" data-target="right_leg" data-loading="true">测试</button>
            </div>
            <div class="status-item">
                <div>
                    <strong>左机械臂</strong>
                </div>
                <button class="btn-outline test-btn" data-target="left_arm" data-loading="true">测试</button>
            </div>
            <div class="status-item">
                <div>
                    <strong>右机械臂</strong>
                </div>
                <button class="btn-outline test-btn" data-target="right_arm" data-loading="true">测试</button>
            </div>
            <div class="status-item">
                <div>
                    <strong>机械头</strong>
                </div>
                <button class="btn-outline test-btn" data-target="head" data-loading="true">测试</button>
            </div>
            <div class="status-item">
                <div>
                    <strong>IMU（USB）</strong>
                </div>
                <button class="btn-outline test-btn" data-target="IMU" data-loading="true">测试</button>
            </div>
        </div>
    </article>

    <article class="glass-card card-wide">
        <div class="card-header">
            <div>
                <h3>当前模块控制</h3>
                <p>启停、速度、力矩与复位操作</p>
            </div>
            <span class="status-tag normal">手动模式</span>
        </div>
        <div class="control-row">
            <div class="control-block">
                <span>启停</span>
                <label class="switch">
                    <input type="checkbox" checked />
                    <span class="slider"></span>
                </label>
            </div>
            <div class="control-block">
                <span>速度调节</span>
                <div class="adjuster">
                    <button class="round-btn">-</button>
                    <span class="adjust-value">72</span>
                    <button class="round-btn">+</button>
                </div>
            </div>
            <div class="control-block">
                <span>力矩设置</span>
                <div class="adjuster">
                    <button class="round-btn">-</button>
                    <span class="adjust-value">42</span>
                    <button class="round-btn">+</button>
                </div>
            </div>
        </div>
        <div class="control-actions">
            <button class="btn-secondary">立即发送</button>
            <button class="btn-outline">复位参数</button>
        </div>
    </article>
    <article class="glass-card card-wide">
        <div class="card-header">
            <div>
                <h3>PyTest 输出日志</h3>
                <p>电机运行时显示实时测试日志</p>
            </div>
        </div>
        <div class="log-panel" id="pytestLogs" style="height:240px; overflow:auto; background:#0b0b0b; color:#e6e6e6; padding:8px; font-family: monospace; font-size:12px;"></div>
    </article>
</section>
{% endblock %}
