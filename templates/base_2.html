<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingLong 测试平台</title>
    <meta name="theme-color" content="#050d1a" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <!-- 数据流光带 - 水平 -->
    <div class="data-stream horizontal" style="top: 15%; left: 0; right: 0;"></div>
    <div class="data-stream horizontal" style="top: 45%; left: 0; right: 0; animation-delay: 1.5s;"></div>
    <div class="data-stream horizontal" style="top: 75%; left: 0; right: 0; animation-delay: 3s;"></div>
    
    <!-- 数据流光带 - 垂直 -->
    <div class="data-stream vertical" style="left: 10%; top: 0; bottom: 0;"></div>
    <div class="data-stream vertical" style="left: 30%; top: 0; bottom: 0; animation-delay: 2s;"></div>
    <div class="data-stream vertical" style="left: 50%; top: 0; bottom: 0; animation-delay: 4s;"></div>
    <div class="data-stream vertical" style="left: 70%; top: 0; bottom: 0; animation-delay: 1s;"></div>
    <div class="data-stream vertical" style="left: 90%; top: 0; bottom: 0; animation-delay: 3s;"></div>

    <!-- 3D 全息网格装饰 -->
    <div style="position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.02; background: 
        repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(0,240,255,0.3) 60px, rgba(0,240,255,0.3) 61px),
        repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(0,240,255,0.3) 60px, rgba(0,240,255,0.3) 61px);
    "></div>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <span style="font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #00f0ff, #0066ff); background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px;">◈ LX</span>
            </div>
            <nav class="nav-icons">
                <a class="nav-item {% if page == 'overview' %}active{% endif %}" href="{{ url_for('index') }}">
                    <span class="nav-icon">⌂</span>
                    <span>整机总览</span>
                </a>
                <a class="nav-item {% if page == 'single-motor-test' %}active{% endif %}" href="{{ url_for('single_motor_test') }}">
                    <span class="nav-icon">⚡</span>
                    <span>单电机测试</span>
                </a>
                <a class="nav-item {% if page == 'comm-log' %}active{% endif %}" href="{{ url_for('comm_log') }}">
                    <span class="nav-icon">📡</span>
                    <span>通讯日志</span>
                </a>
                <a class="nav-item {% if page == 'test-report' %}active{% endif %}" href="{{ url_for('test_report') }}">
                    <span class="nav-icon">📊</span>
                    <span>测试报告</span>
                </a>
                <a class="nav-item {% if page == 'system-config' %}active{% endif %}" href="{{ url_for('system_config') }}">
                    <span class="nav-icon">⚙</span>
                    <span>系统配置</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="emergency-button">⏻ 急停</button>
            </div>
            <div class="sidebar-user">
                <div class="sidebar-avatar">A</div>
                <div class="sidebar-user-copy">
                    <strong>Admin</strong>
                    <span><i></i>设备在线</span>
                </div>
                <button type="button" class="sidebar-user-more" aria-label="用户菜单">⋮</button>
            </div>
        </aside>

        <main class="main-panel">
            <div class="app-header">
                <div>
                    <div class="app-label">◈ LINGLONG 1025 测试平台</div>
                </div>
                <div style="display: flex; align-items: center; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(0,240,255,0.3);">
                    <span>● SYS: ONLINE</span>
                    <span>● UPTIME: 00:47:32</span>
                </div>
            </div>
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- 模态框 -->
    <div class="modal-backdrop" id="curveModal">
        <div class="modal-card curve-modal-card">
            <div class="modal-header">
                <div>
                    <h3 style="font-family: 'Orbitron', monospace; font-size: 20px; background: linear-gradient(135deg, #00f0ff, #0066ff); background-clip: text; -webkit-text-fill-color: transparent;">◈ 实时性能洞察</h3>
                    <p style="color: rgba(180,210,255,0.4); font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-top: 4px;">跟踪延迟与瞬时丢包率 · 阈值告警系统</p>
                </div>
                <button class="close-btn" id="closeModal" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(0,240,255,0.1); background: rgba(0,240,255,0.02); color: rgba(0,240,255,0.5); font-size: 20px; cursor: pointer; transition: all 0.3s ease;">×</button>
            </div>
            <div class="modal-content">
                <div class="modal-topline" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;">
                    <div class="modal-legend" style="display: flex; align-items: center; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(180,210,255,0.4);">
                        <span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff2d75; box-shadow: 0 0 12px rgba(255,45,117,0.3); margin-right: 6px;"></span>跟踪延迟 ms</span>
                        <span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ffd740; box-shadow: 0 0 12px rgba(255,215,64,0.3); margin-right: 6px;"></span>瞬时丢包率 %</span>
                    </div>
                    <div style="display: flex; gap: 8px; font-size: 10px; font-family: 'JetBrains Mono', monospace; color: rgba(180,210,255,0.3);">
                        <span style="padding: 2px 10px; border: 1px solid rgba(255,45,117,0.15); border-radius: 12px; color: rgba(255,45,117,0.5);">▸ 20ms 阈值</span>
                        <span style="padding: 2px 10px; border: 1px solid rgba(255,215,64,0.15); border-radius: 12px; color: rgba(255,215,64,0.5);">▸ 0.5%/3% 阈值</span>
                    </div>
                </div>

                <div class="chart-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                    <div class="line-panel" style="background: rgba(0,0,0,0.3); border-radius: 8px; padding: 16px; border: 1px solid rgba(0,240,255,0.05);">
                        <div class="chart-label" style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(0,240,255,0.3); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;">◈ 跟踪延迟</div>
                        <div class="line-graph" style="height: 80px; background: rgba(0,0,0,0.2); border-radius: 4px; position: relative; overflow: hidden;">
                            <div style="position: absolute; top: 35%; left: 0; right: 0; border-top: 1px dashed rgba(255,45,117,0.15);"></div>
                            <!-- 模拟波形 -->
                            <svg width="100%" height="100%" style="position: absolute; inset: 0;">
                                <polyline points="0,60 20,45 40,55 60,30 80,50 100,40 120,65 140,35 160,55 180,20 200,50 220,40 240,60 260,30 280,50 300,25" 
                                    fill="none" stroke="rgba(255,45,117,0.3)" stroke-width="1.5"/>
                            </svg>
                        </div>
                    </div>
                    <div class="line-panel" style="background: rgba(0,0,0,0.3); border-radius: 8px; padding: 16px; border: 1px solid rgba(0,240,255,0.05);">
                        <div class="chart-label" style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(0,240,255,0.3); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;">◈ 瞬时丢包率</div>
                        <div class="line-graph" style="height: 80px; background: rgba(0,0,0,0.2); border-radius: 4px; position: relative; overflow: hidden;">
                            <div style="position: absolute; top: 50%; left: 0; right: 0; border-top: 1px dashed rgba(255,215,64,0.1);"></div>
                            <div style="position: absolute; top: 80%; left: 0; right: 0; border-top: 1px dashed rgba(255,45,117,0.1);"></div>
                            <svg width="100%" height="100%" style="position: absolute; inset: 0;">
                                <polyline points="0,30 20,25 40,35 60,20 80,28 100,40 120,15 140,32 160,10 180,25 200,30 220,18 240,35 260,22 280,28 300,12" 
                                    fill="none" stroke="rgba(255,215,64,0.25)" stroke-width="1.5"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="modal-actions" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-top: 16px; border-top: 1px solid rgba(0,240,255,0.04);">
                    <div class="range-buttons" style="display: flex; gap: 4px;">
                        <button class="btn-outline active" style="padding: 4px 14px; font-size: 10px;">5min</button>
                        <button class="btn-outline" style="padding: 4px 14px; font-size: 10px;">30min</button>
                        <button class="btn-outline" style="padding: 4px 14px; font-size: 10px;">1h</button>
                    </div>
                    <button class="btn-secondary" style="font-size: 11px; padding: 6px 18px;">⬇ 导出快照</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
