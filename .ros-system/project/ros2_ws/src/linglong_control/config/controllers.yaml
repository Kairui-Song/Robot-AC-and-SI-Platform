controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    # Export all interfaces, including control_health on /dynamic_joint_states.
    use_local_topics: false

arm_trajectory_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_5]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 2.0
      joint_1: {trajectory: 0.15, goal: 0.005}
      joint_2: {trajectory: 0.15, goal: 0.005}
      joint_3: {trajectory: 0.15, goal: 0.005}
      joint_5: {trajectory: 0.15, goal: 0.005}
